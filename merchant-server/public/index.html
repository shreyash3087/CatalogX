<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatalogX Merchant Storefront</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Razorpay Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🛍️</span>
        <h1 id="merchant-title" class="text-xl font-bold tracking-tight text-slate-950">Storefront</h1>
        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
          Live Store
        </span>
      </div>
      
      <!-- Cart Trigger -->
      <button onclick="toggleCart()" class="relative p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full transition-colors">
        <span>🛒</span>
        <span id="cart-badge" class="absolute -top-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full bg-blue-600 text-[10px] font-bold text-white scale-0 transition-transform">0</span>
      </button>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Loaded dynamically -->
      <div class="col-span-full text-center py-20 text-slate-400">
        <div class="animate-spin inline-block w-8 h-8 border-4 border-current border-t-transparent text-blue-600 rounded-full mb-2"></div>
        <p>Loading catalog products...</p>
      </div>
    </div>
  </main>

  <!-- Cart Sidebar Drawer -->
  <div id="cart-drawer" class="fixed inset-0 overflow-hidden z-50 pointer-events-none opacity-0 transition-opacity duration-300">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm pointer-events-auto" onclick="toggleCart()"></div>
    <div class="absolute inset-y-0 right-0 max-w-md w-full bg-white shadow-xl flex flex-col pointer-events-auto transform translate-x-full transition-transform duration-300">
      
      <!-- Cart Header -->
      <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-900">Your Basket</h2>
        <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">×</button>
      </div>

      <!-- Cart Items -->
      <div id="cart-items" class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
        <p class="text-slate-400 text-center py-10">Your basket is empty.</p>
      </div>

      <!-- Cart Footer -->
      <div class="border-t border-slate-100 p-6 bg-slate-50 space-y-4">
        <div class="flex items-center justify-between text-base font-medium text-slate-900">
          <span>Subtotal</span>
          <span id="cart-total">₹0.00</span>
        </div>
        <button id="checkout-btn" onclick="checkout()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-lg font-semibold tracking-wide transition-colors flex items-center justify-center gap-2">
          Place Order
        </button>
      </div>

    </div>
  </div>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-slate-400 text-xs mt-auto">
    <p>Powered by CatalogX Agent-Readable API protocol. Seamlessly purchasable by AI Shopping Agents.</p>
  </footer>

  <script>
    let products = [];
    let cart = [];
    let merchantInfo = {};

    // Load merchant manifest and products on init
    async function init() {
      try {
        const infoRes = await fetch('/.well-known/agent-catalog');
        merchantInfo = await infoRes.json();
        document.getElementById('merchant-title').textContent = merchantInfo.merchant.name;
        document.title = merchantInfo.merchant.name + ' - CatalogX Storefront';

        const prodRes = await fetch('/api/products');
        const prodData = await prodRes.json();
        products = prodData.products;
        
        renderProducts();
      } catch (err) {
        console.error('Initialization error:', err);
      }
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = products.map(p => `
        <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col h-full">
          <div class="bg-slate-100 aspect-[4/3] flex items-center justify-center text-5xl">
            ${p.category === 'electronics' ? '🔌' : '👟'}
          </div>
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${p.brand}</span>
              <h3 class="font-bold text-slate-900 text-base leading-tight mt-0.5 mb-1.5">${p.name}</h3>
              <p class="text-xs text-slate-500 line-clamp-3 leading-relaxed mb-4">${p.description}</p>
            </div>
            
            <div class="flex items-center justify-between mt-auto">
              <span class="text-lg font-extrabold text-blue-600">${p.price.display}</span>
              
              ${p.in_stock ? `
                <button onclick="addToCart('${p.id}')" class="bg-slate-100 hover:bg-blue-600 hover:text-white text-blue-600 text-xs font-semibold py-2 px-3.5 rounded-lg transition-all">
                  Add Basket
                </button>
              ` : `
                <span class="text-xs font-semibold text-rose-500 bg-rose-50 border border-rose-100 py-1.5 px-3 rounded-lg">Out of stock</span>
              `}
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleCart() {
      const drawer = document.getElementById('cart-drawer');
      const inner = drawer.querySelector('.translate-x-full');
      
      if (drawer.classList.contains('opacity-0')) {
        drawer.classList.remove('opacity-0', 'pointer-events-none');
        setTimeout(() => drawer.querySelector('div:nth-child(2)').classList.remove('translate-x-full'), 50);
      } else {
        drawer.querySelector('div:nth-child(2)').classList.add('translate-x-full');
        setTimeout(() => drawer.classList.add('opacity-0', 'pointer-events-none'), 300);
      }
    }

    function addToCart(productId) {
      const prod = products.find(p => p.id === productId);
      if (!prod) return;

      const existing = cart.find(item => item.product.id === productId);
      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ product: prod, quantity: 1 });
      }

      updateCart();
      
      // Animate badge
      const badge = document.getElementById('cart-badge');
      badge.classList.remove('scale-0');
      badge.classList.add('scale-100');
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.product.id !== productId);
      updateCart();
      if (cart.length === 0) {
        document.getElementById('cart-badge').classList.add('scale-0');
      }
    }

    function updateCart() {
      const itemsContainer = document.getElementById('cart-items');
      const totalLabel = document.getElementById('cart-total');
      const badge = document.getElementById('cart-badge');

      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      badge.textContent = totalItems;

      if (cart.length === 0) {
        itemsContainer.innerHTML = '<p class="text-slate-400 text-center py-10">Your basket is empty.</p>';
        totalLabel.textContent = '₹0.00';
        return;
      }

      let subtotal = 0;
      itemsContainer.innerHTML = cart.map(item => {
        const cost = item.product.price.paise * item.quantity;
        subtotal += cost;
        return `
          <div class="flex items-center gap-4 py-3 border-b border-slate-100">
            <div class="bg-slate-100 h-12 w-12 rounded-lg flex items-center justify-center text-2xl flex-shrink-0">
              ${item.product.category === 'electronics' ? '🔌' : '👟'}
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="font-semibold text-slate-900 text-sm truncate leading-tight">${item.product.name}</h4>
              <span class="text-xs text-slate-500">Qty: ${item.quantity} · ${item.product.price.display}</span>
            </div>
            <button onclick="removeFromCart('${item.product.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-medium">Remove</button>
          </div>
        `;
      }).join('');

      totalLabel.textContent = '₹' + (subtotal / 100).toLocaleString('en-IN', { minimumFractionDigits: 2 });
    }

    async function checkout() {
      if (cart.length === 0) return;
      
      const btn = document.getElementById('checkout-btn');
      btn.disabled = true;
      btn.textContent = 'Creating order...';

      try {
        const item = cart[0]; // Checkout first item for demonstration simplicity
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            product_id: item.product.id,
            size: item.product.sizes[0],
            quantity: item.quantity
          })
        });

        const order = await response.json();

        if (order.error) {
          alert('Checkout failed: ' + order.error);
          btn.disabled = false;
          btn.textContent = 'Place Order';
          return;
        }

        // Open standard Razorpay Checkout Web Modal
        const options = {
          key: order.razorpay_key_id,
          amount: order.amount.paise,
          currency: 'INR',
          name: merchantInfo.merchant.name,
          description: 'Autonomous Standard Checkout Flow',
          order_id: order.razorpay_order_id,
          handler: async function (response) {
            btn.textContent = 'Verifying payment...';
            
            // Verify signature on backend
            const verifyRes = await fetch('/api/payments/verify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature
              })
            });

            const result = await verifyRes.json();
            if (result.success) {
              alert('Payment Successful! Receipt ID: ' + result.order_id);
              cart = [];
              updateCart();
              document.getElementById('cart-badge').classList.add('scale-0');
              toggleCart();
              
              // Refresh inventory count
              init();
            } else {
              alert('Signature verification failed!');
            }
            
            btn.disabled = false;
            btn.textContent = 'Place Order';
          },
          prefill: {
            name: "John Doe",
            email: "john.doe@example.com",
            contact: "9999999999"
          },
          theme: {
            color: "#2563eb"
          }
        };

        const rzp = new Razorpay(options);
        rzp.open();
        
      } catch (err) {
        alert('Payment creation failed. See log.');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Place Order';
      }
    }

    init();
  </script>
</body>
</html>
